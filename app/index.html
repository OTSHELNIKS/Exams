<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="description" content="NAME — соревновательный матчмейкинг MLBB: честный драфт игроков, автоматические лобби, рейтинг и призы." />
    <title>NAME — Играй. Побеждай. Зарабатывай.</title>
    <!-- Netlify на free-плане сам вставляет поверх сайта бейдж «Powered by Netlify»
         (скрипт /.netlify/scripts/hud создаёт рамку #nl-badge-frame с промо-панелью).
         В нашем коде этого нет, поэтому гасим на стороне страницы.
         Окончательное выключение — в панели Netlify:
         Project configuration → General → Powered by Netlify badge → Off. -->
    <style>
      #nl-badge-frame, #nl-hud-frame,
      iframe[src*="/.netlify/"], iframe[id^="nl-"], iframe[id*="netlify-badge"],
      netlify-badge, .nl-badge, [data-netlify-badge] { display: none !important; visibility: hidden !important; }
    </style>
    <script>
      (function () {
        var SEL = [
          '#nl-badge-frame', '#nl-hud-frame', '[id^="nl-"][id$="-frame"]',
          'iframe[src*="/.netlify/"]', 'iframe[id*="netlify"]',
          'netlify-badge', '.nl-badge', '[data-netlify-badge]'
        ].join(',')
        function strip() {
          var nodes = document.querySelectorAll(SEL)
          for (var i = 0; i < nodes.length; i += 1) {
            nodes[i].style.setProperty('display', 'none', 'important')
            nodes[i].remove()
          }
        }
        strip()
        if (typeof MutationObserver === 'function') {
          new MutationObserver(function (records) {
            for (var i = 0; i < records.length; i += 1) {
              var added = records[i].addedNodes
              for (var j = 0; j < added.length; j += 1) {
                var n = added[j]
                if (n.nodeType !== 1) continue
                var isBadge = (n.id && /^nl-|netlify/i.test(n.id))
                  || (n.tagName === 'IFRAME' && /netlify|\.netlify/i.test(n.src || ''))
                  || (n.tagName === 'NETLIFY-BADGE')
                if (isBadge) { n.remove(); continue }
                if (n.querySelector && n.querySelector(SEL)) strip()
              }
            }
          }).observe(document.documentElement, { childList: true, subtree: true })
        }
        window.addEventListener('load', strip)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
