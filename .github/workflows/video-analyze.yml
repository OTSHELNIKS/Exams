name: video-analyze

on:
  push:
    paths:
      - '.github/workflows/video-analyze.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Setup python tooling (no apt)
        run: |
          set -e
          python -m pip install --quiet --disable-pip-version-check requests imageio-ffmpeg gdown
          echo "FFMPEG=$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" >> "$GITHUB_ENV"

      - name: Download video (public Drive copy)
        env:
          DRIVE_ID: 1VK_ZVojS8UCmb3Bd5T6gIt5Zo5V2ePjt
        run: |
          set -ex
          cat > download.py <<'PY'
          import os, re, sys, requests
          fid = os.environ["DRIVE_ID"]
          s = requests.Session()
          s.headers.update({"User-Agent": "Mozilla/5.0"})
          base = "https://drive.usercontent.google.com/download"
          r = s.get(base, params={"id": fid, "export": "download"}, stream=True, timeout=120)
          print("first:", r.status_code, r.headers.get("content-type"), r.url)
          ctype = r.headers.get("content-type", "")
          if "text/html" in ctype or r.status_code != 200:
              html = r.text
              print(html[:800])
              m = re.search(r'name="uuid"\s+value="([^"]+)"', html)
              params = {"id": fid, "export": "download", "confirm": "t"}
              if m:
                  params["uuid"] = m.group(1)
              r = s.get(base, params=params, stream=True, timeout=300)
              print("second:", r.status_code, r.headers.get("content-type"), r.url)
          total = 0
          with open("video.mp4", "wb") as f:
              for chunk in r.iter_content(1 << 20):
                  if chunk:
                      f.write(chunk)
                      total += len(chunk)
          print("downloaded bytes:", total)
          with open("video.mp4", "rb") as f:
              print("magic:", f.read(16))
          sys.exit(0 if total > 100_000_000 else 1)
          PY
          python download.py || gdown --id "$DRIVE_ID" -O video.mp4
          ls -lh video.mp4
          test "$(stat -c%s video.mp4)" -gt 100000000
          "$FFMPEG" -hide_banner -i video.mp4 2>&1 | head -25 || true

      - name: Extract frames and contact sheets
        run: |
          set -e
          mkdir -p out/frames out/sheets
          "$FFMPEG" -hide_banner -loglevel error -i video.mp4 -vf "fps=1/5" -q:v 3 out/frames/f_%03d.jpg
          "$FFMPEG" -hide_banner -loglevel error -framerate 1 -i out/frames/f_%03d.jpg -vf "scale=360:-2,tile=4x5" -q:v 3 out/sheets/sheet_%02d.jpg
          "$FFMPEG" -hide_banner -loglevel error -i video.mp4 -vn -ac 1 -ar 16000 -c:a pcm_s16le out/audio.wav
          ls out/frames | wc -l

      - name: Transcribe audio (Russian)
        continue-on-error: true
        timeout-minutes: 25
        run: |
          set -o pipefail
          {
            python -m pip install "av==14.4.0" faster-whisper
            python - <<'PY'
          from faster_whisper import WhisperModel
          m = WhisperModel("small", device="cpu", compute_type="int8")
          segments, info = m.transcribe("out/audio.wav", language="ru", vad_filter=True, beam_size=1)
          with open("out/transcript.txt", "w", encoding="utf-8") as f:
              for s in segments:
                  f.write(f"[{s.start:7.1f} - {s.end:7.1f}] {s.text.strip()}\n")
          print("transcription done")
          PY
          } 2>&1 | tee out/transcribe.log

      - name: Commit analysis bundle into repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tar czf /tmp/analysis.tar.gz out/frames out/sheets $(ls out/transcript.txt out/transcribe.log 2>/dev/null) || tar czf /tmp/analysis.tar.gz out/frames out/sheets
          ls -lh /tmp/analysis.tar.gz
          git clone --branch arena/7c1dfdfb-exams --depth 1 "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git" /tmp/repo
          mkdir -p /tmp/repo/.agent_bundle
          cp /tmp/analysis.tar.gz /tmp/repo/.agent_bundle/analysis.tar.gz
          if [ -f out/transcript.txt ]; then cp out/transcript.txt /tmp/repo/.agent_bundle/transcript.txt; fi
          if [ -f out/transcribe.log ]; then cp out/transcribe.log /tmp/repo/.agent_bundle/transcribe.log; fi
          cd /tmp/repo
          git config user.name "arena-agent"
          git config user.email "agent@arena.ai"
          git add .agent_bundle/analysis.tar.gz
          git commit -m "temp: analysis bundle for client video" || echo "nothing to commit"
          git pull --rebase origin arena/7c1dfdfb-exams
          git push origin HEAD:arena/7c1dfdfb-exams
