# NAME MLBB — деплой на GitHub Pages (бесплатно, без лимитов Netlify).
# Сайт: https://otshelniks.github.io/Exams/
# Включается один раз: Settings → Pages → Source = GitHub Actions.
#
# VITE_SUPABASE_URL и VITE_SUPABASE_PUBLISHABLE_KEY публичны по дизайну
# (publishable-ключ всё равно уезжает в браузерный JS), поэтому они лежат
# прямо здесь. Настоящие секреты (service_role) сюда добавлять нельзя.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - arena/cc650609-exams
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.pages.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      # Pages включается один раз в настройках репозитория (Settings → Pages →
      # Source: GitHub Actions). Пока не включён — сборка проходит, деплой
      # пропускается и в логе будет подсказка, а не красный прогон.
      - id: pages
        name: Check Pages availability
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages не включён::Включите один раз: Settings → Pages → Source: GitHub Actions"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        run: npm --prefix app ci
      - name: Build
        env:
          VITE_BASE: /Exams/
          VITE_SUPABASE_URL: https://yjedqdbwvjvikyixsduw.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_yzJAjp-Nt7gfcsRXt0jKAQ_tFl2_-_x
          # ID приложения VK ID «NAME» (публичный, не секрет).
          # Можно переопределить переменной репозитория VITE_VK_CLIENT_ID.
          VITE_VK_CLIENT_ID: ${{ vars.VITE_VK_CLIENT_ID || '54867424' }}
        run: npm --prefix app run build
      - name: SPA fallback
        run: cp app/dist/index.html app/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    if: needs.build.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    # Окружение github-pages намеренно не указано: у него стоит правило
    # «деплой только с main», а мы публикуем с рабочей ветки. Деплой идёт
    # через OIDC-токен (permissions: pages/id-token), окружение не требуется.
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
