# Публикация NAME на GitHub Pages (https://otshelniks.github.io/Exams/).
# Одноразовая настройка (вручную, нужны права админа репозитория):
#   1. Settings -> Pages -> Source: "GitHub Actions".
#   2. Settings -> Secrets and variables -> Actions -> New repository secret:
#      - SUPABASE_URL (например https://xxxx.supabase.co)
#      - SUPABASE_PUBLISHABLE_KEY (только publishable ключ, НЕ service_role/secret!)
# Дальше каждый пуш в эту ветку сам пересобирает и публикует сайт.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [arena/cc650609-exams]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install deps
        run: npm ci
        working-directory: app
      - name: Write Supabase env (publishable key only)
        run: |
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_KEY" > .env
        working-directory: app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      - name: Build single-file app
        run: npm run build:singlefile
        working-directory: app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist-singlefile

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
